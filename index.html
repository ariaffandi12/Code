
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>bima+ DigitalHub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #f2f2f2;
    max-width: 390px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ─── SCROLL CONTAINER ─── */
  .scroll-body {
    height: 100vh;
    overflow-y: auto;
    padding-bottom: 80px;
    scroll-behavior: smooth;
  }

  /* ─── TOP HEADER ─── */
  .top-header {
    background: white;
    padding: 16px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left { display: flex; align-items: center; gap: 10px; }

  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #eee;
    display: flex; align-items: center; justify-content: center;
    color: #aaa; font-size: 20px;
  }

  .greeting { line-height: 1.3; }
  .greeting-text { font-size: 12px; color: #888; }
  .phone-row { display: flex; align-items: center; gap: 6px; }
  .phone { font-size: 13px; font-weight: 700; color: #222; }
  .badge-silver {
    background: #e0e0e0; color: #666;
    font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 20px;
  }

  .header-icons { display: flex; align-items: center; gap: 14px; }
  .header-icons svg { width: 22px; height: 22px; color: #333; cursor: pointer; }

  .chat-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #e4003a, #ff6b6b);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 14px; font-weight: 700;
  }

  /* ─── JELAJAHI BAR ─── */
  .jelajahi-bar {
    background: white;
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #f0f0f0;
  }

  .jelajahi-left { display: flex; align-items: center; gap: 10px; }
  .jelajahi-icon {
    width: 32px; height: 32px; border-radius: 50%;
    background: #fff0f3; display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .jelajahi-text { font-size: 15px; font-weight: 700; color: #222; }
  .semua-btn { display: flex; align-items: center; gap: 5px; color: #e4003a; font-size: 13px; font-weight: 700; }

  /* ─── SECTION ─── */
  .section { background: white; margin-top: 8px; padding: 16px; }

  .section-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .section-title-wrap { display: flex; gap: 10px; align-items: flex-start; }
  .dots { display: flex; flex-direction: column; gap: 3px; padding-top: 3px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: #ccc; }

  .section-label { font-size: 12px; color: #e4003a; font-weight: 700; margin-bottom: 2px; }
  .section-title { font-size: 16px; font-weight: 800; color: #111; }
  .lihat-semua { font-size: 13px; color: #e4003a; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 2px; }

  /* ─── TABS ─── */
  .tabs {
    display: flex; gap: 0;
    background: #f0f0f0;
    border-radius: 20px;
    padding: 3px;
    margin-bottom: 14px;
  }

  .tab {
    flex: 1; text-align: center;
    padding: 7px 0;
    border-radius: 18px;
    font-size: 13px; font-weight: 600;
    color: #888; cursor: pointer;
    transition: all 0.2s;
  }

  .tab.active {
    background: white;
    color: #222;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* ─── FILM GRID ─── */
  .film-scroll {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .film-scroll::-webkit-scrollbar { display: none; }

  .film-thumb {
    min-width: 80px; height: 80px;
    border-radius: 14px;
    background: #ddd;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }

  .film-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .film-thumb .star-badge {
    position: absolute; top: 4px; left: 4px;
    background: rgba(0,0,0,0.55);
    color: white; font-size: 9px; font-weight: 700;
    padding: 2px 5px; border-radius: 4px;
    display: flex; align-items: center; gap: 2px;
  }

  /* Row 2 & 3 film grid */
  .film-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
  }

  .film-grid-item {
    aspect-ratio: 1;
    border-radius: 14px;
    background: #ddd;
    overflow: hidden;
  }

  .film-grid-item img { width: 100%; height: 100%; object-fit: cover; }

  .film-label { font-size: 12px; color: #888; margin-top: 10px; margin-bottom: 4px; }

  /* ─── CARD SECTION (Kek, Vidio) ─── */
  .card-scroll {
    display: flex; gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .card-scroll::-webkit-scrollbar { display: none; }

  .media-card {
    min-width: 150px; height: 190px;
    border-radius: 14px;
    background: #222;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }

  .media-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }

  .media-card .provider-badge {
    position: absolute; top: 8px; left: 8px;
    background: white;
    padding: 3px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 800; color: #e4003a;
  }

  .media-card.vidio .provider-badge { color: #1a1a8c; }
  .media-card.empty { background: #e8e8e8; }

  /* ─── BANNER ─── */
  .banner-section {
    background: white; margin-top: 8px; padding: 12px 16px;
  }

  .banner-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .banner-card {
    border-radius: 14px;
    height: 70px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
    overflow: hidden;
    position: relative;
  }

  .banner-card.purple { background: linear-gradient(135deg, #7c3aed, #a855f7); }
  .banner-card.dark { background: #111; }

  .banner-text { font-size: 12px; font-weight: 800; color: white; line-height: 1.3; z-index: 1; }
  .banner-arrow { color: white; font-size: 18px; font-weight: 700; z-index: 1; }

  /* ─── BOTTOM NAVBAR ─── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%) translateY(0);
    width: 390px;
    background: white;
    border-top: 1px solid #eee;
    display: flex;
    padding: 8px 0 16px;
    z-index: 100;

    /* Smooth transition */
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Hidden state — dorong ke bawah */
  .bottom-nav.hidden {
    transform: translateX(-50%) translateY(100%);
  }

  .nav-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    cursor: pointer;
  }

  .nav-icon {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
  }

  .nav-icon svg { width: 22px; height: 22px; stroke: #aaa; fill: none; stroke-width: 1.8; }
  .nav-item.active .nav-icon svg { stroke: #e4003a; }

  .nav-item.active .nav-icon .digital-hub-icon {
    background: #fff0f3;
    border-radius: 50%;
    padding: 4px;
  }

  .nav-label { font-size: 10px; color: #aaa; font-weight: 600; }
  .nav-item.active .nav-label { color: #e4003a; }

  /* digital hub icon khusus */
  .dh-wrap {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #fff0f3;
    display: flex; align-items: center; justify-content: center;
    margin-top: -4px;
  }
  .dh-wrap svg { width: 20px; height: 20px; stroke: #e4003a; fill: none; stroke-width: 1.8; }

  /* placeholder film colors */
  .c1 { background: #1a1a3e; }
  .c2 { background: #2d1a1a; }
  .c3 { background: #1a2d1a; }
  .c4 { background: #2d2d1a; }
  .c5 { background: #1a2d2d; }
  .c6 { background: #2d1a2d; }
</style>
</head>
<body>

<div class="scroll-body" id="scrollBody">

  <!-- TOP HEADER -->
  <div class="top-header">
    <div class="header-left">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </div>
      <div class="greeting">
        <div class="greeting-text">Selamat malam,</div>
        <div class="phone-row">
          <span class="phone">0895366880536</span>
          <span class="badge-silver">Silver</span>
        </div>
      </div>
    </div>
    <div class="header-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div class="chat-avatar">S</div>
    </div>
  </div>

  <!-- JELAJAHI -->
  <div class="jelajahi-bar">
    <div class="jelajahi-left">
      <div class="jelajahi-icon">🧭</div>
      <span class="jelajahi-text">Jelajahi</span>
    </div>
    <div class="semua-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      Semua
    </div>
  </div>

  <!-- FILM & TV STREAMING -->
  <div class="section">
    <div class="section-header">
      <div class="section-title-wrap">
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div>
          <div class="section-label">Film &amp; TV Streaming</div>
          <div class="section-title">Nikmati keseruan filmnya</div>
        </div>
      </div>
      <div class="lihat-semua">Lihat semua ›</div>
    </div>

    <div class="tabs">
      <div class="tab active">Semua</div>
      <div class="tab">Vidio</div>
      <div class="tab">Klikfilm</div>
    </div>

    <!-- Row 1 scroll -->
    <div class="film-scroll">
      <div class="film-thumb c1"></div>
      <div class="film-thumb c2"></div>
      <div class="film-thumb c3"></div>
      <div class="film-thumb c4"></div>
      <div class="film-thumb c5"></div>
    </div>

    <!-- Row 2 grid -->
    <div class="film-grid">
      <div class="film-grid-item c2"></div>
      <div class="film-grid-item c3"></div>
      <div class="film-grid-item c5"></div>
      <div class="film-grid-item c6"></div>
    </div>

    <!-- Row 3 grid -->
    <div class="film-grid">
      <div class="film-grid-item c4"></div>
      <div class="film-grid-item c1"></div>
      <div class="film-grid-item c6"></div>
      <div class="film-grid-item c2"></div>
    </div>

    <div class="film-label">Film Untuk Waktu Santaimu</div>

    <!-- Card scroll -->
    <div class="card-scroll" style="margin-top: 12px;">
      <div class="media-card c2">
        <div class="provider-badge">Kek</div>
      </div>
      <div class="media-card empty">
        <div class="provider-badge">Kek</div>
      </div>
      <div class="media-card vidio c4">
        <div class="provider-badge" style="color:#1a1a8c;">Vidio</div>
      </div>
    </div>
  </div>

  <!-- BANNER -->
  <div class="banner-section">
    <div class="banner-grid">
      <div class="banner-card purple">
        <div class="banner-text">Tonton Video<br>Trending!</div>
        <div class="banner-arrow">›</div>
      </div>
      <div class="banner-card dark">
        <div class="banner-text">Top Up<br>Games</div>
        <div class="banner-arrow">›</div>
      </div>
    </div>
  </div>

  <div style="height: 40px;"></div>
</div>

<!-- BOTTOM NAVBAR -->
<nav class="bottom-nav" id="bottomNav">
  <div class="nav-item">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    </div>
    <span class="nav-label">bima+</span>
  </div>

  <div class="nav-item active">
    <div class="dh-wrap">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
    </div>
    <span class="nav-label">DigitalHub</span>
  </div>

  <div class="nav-item">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    </div>
    <span class="nav-label">Beli</span>
  </div>

  <div class="nav-item">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
    </div>
    <span class="nav-label">Reward</span>
  </div>

  <div class="nav-item">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <span class="nav-label">Akun</span>
  </div>
</nav>

<script>
  const scrollBody = document.getElementById('scrollBody');
  const bottomNav = document.getElementById('bottomNav');

  let lastScrollY = 0;
  let scrollDistance = 0;
  const THRESHOLD = 60; // px sebelum navbar bereaksi

  scrollBody.addEventListener('scroll', () => {
    const currentScrollY = scrollBody.scrollTop;
    const diff = currentScrollY - lastScrollY;

    scrollDistance += diff;

    // Scroll ke bawah cukup jauh → sembunyikan navbar
    if (scrollDistance > THRESHOLD) {
      bottomNav.classList.add('hidden');
      scrollDistance = THRESHOLD;
    }

    // Scroll ke atas → tampilkan navbar
    if (scrollDistance < -THRESHOLD) {
      bottomNav.classList.remove('hidden');
      scrollDistance = -THRESHOLD;
    }

    // Selalu tampil di posisi paling atas
    if (currentScrollY < 10) {
      bottomNav.classList.remove('hidden');
      scrollDistance = 0;
    }

    lastScrollY = currentScrollY;
  });
</script>

</body>
</html>
